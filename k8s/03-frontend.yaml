apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: future-movement-summary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build and push this image first, e.g.:
          #   docker build -t your-registry/future-movement-frontend:1.0.0 ./frontend
          #   docker push your-registry/future-movement-frontend:1.0.0
          image: your-registry/future-movement-frontend:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: future-movement-summary
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
# Use LoadBalancer for external access, or use Ingress/port-forward.
