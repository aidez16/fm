# Example only - requires NGINX Ingress Controller and a real hostname.
# Frontend Nginx handles /api, so Ingress routes traffic to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: future-movement-summary
  namespace: future-movement-summary
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  rules:
    - host: future-movements.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
