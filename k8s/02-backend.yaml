apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: future-movement-summary
spec:
  # Not safe to raise: the aggregate is per-pod and in memory, so replicas
  # sharing the consumer group would each hold a subset of the partitions and
  # answer /summary differently. Each would also re-run the seeder, multiplying
  # the totals. Scaling out needs a shared store (or a group per pod) and
  # seeding moved to a Job.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Build and push this image first, e.g.:
          #   docker build -t your-registry/future-movement-backend:1.0.0 ./backend
          #   docker push your-registry/future-movement-backend:1.0.0
          image: your-registry/future-movement-backend:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.future-movement-summary.svc.cluster.local:9092
            - name: FUTUREMOVEMENT_KAFKA_TOPIC
              value: future-movements
            - name: FUTUREMOVEMENT_CORS_ORIGIN
              value: "*" # tighten to the real frontend origin/ingress host in production
            # The startup-generated Output.csv is a local-dev convenience (docker-compose
            # bind-mounts it back to the host). Pods have no such mount and their
            # filesystem is ephemeral, so skip the write and use GET /summary/csv instead.
            - name: FUTUREMOVEMENT_OUTPUT_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/v1/future-movements/summary
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/future-movements/summary
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: future-movement-summary
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
