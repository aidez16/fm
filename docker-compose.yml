name: future-movement-summary

services:
  # Single-node broker in KRaft mode, for local dev only - a real deployment
  # would point KAFKA_BOOTSTRAP_SERVERS at a managed cluster.
  kafka:
    image: apache/kafka:3.8.0
    container_name: future-movement-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "ZmZmZmZmZmZmZmZmZmZmZm"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: future-movement-backend
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      FUTUREMOVEMENT_KAFKA_TOPIC: future-movements
      FUTUREMOVEMENT_CORS_ORIGIN: http://localhost:4200
      # The volume below maps this back onto ./sample-output on the host.
      FUTUREMOVEMENT_OUTPUT_FILE_PATH: /app/sample-output/Output.csv
    volumes:
      - ./sample-output:/app/sample-output
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: future-movement-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
